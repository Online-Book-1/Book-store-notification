name: Deploy to Kubernetes
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book-store-app-noti:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/book-store-app-noti:${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG2 }}" | base64 -d > ~/.kube/config

      - name: Apply Kubernetes configs
        run: |
          kubectl apply -f kafka_services.yaml
          kubectl apply -f deployment.yaml
          kubectl apply -f services.yaml

      # ← wait for Kafka to be fully ready before restarting apps
      - name: Wait for Kafka to be ready
        run: |
          echo "Waiting for Kafka pod to be ready..."
          kubectl wait --for=condition=ready pod/kafka-0 \
            --timeout=120s
          echo "Kafka is ready!"
          # extra buffer — Kafka needs time after pod is ready
          sleep 15

      - name: Wait for Kafka y
        run: |
          echo "Waiting for Kafka pod to be ready..."
          kubectl wait --for=condition=ready pod/kafka-0 \
            --timeout=120s
          echo "Kafka is ready!"
          # extra buffer — Kafka needs time after pod is ready
          sleep 15

      - name: Apply Kubernetes configs
        run: |
          
          kubectl apply -f deployment.yaml
          kubectl apply -f services.yaml

      - name: Refresh Deployment
        run: |
          kubectl rollout restart deployment/book-store-app-notification-deployment

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/book-store-app-notification-deployment \
            --timeout=120s