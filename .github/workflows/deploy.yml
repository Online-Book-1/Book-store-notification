# cicd — remove duplicate wait steps
name: Deploy to Kubernetes
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book-store-app-noti:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/book-store-app-noti:${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG2 }}" | base64 -d > ~/.kube/config

      - name: Apply Kafka config


        run: |
          kubectl delete deployment --all
          kubectl apply -f kafka_services.yaml
          kubectl apply -f redis_deployment.yaml


      # ← only ONE wait step
      - name: Wait for Kafka to be ready
        run: |
          echo "Waiting for Kafka..."
          kubectl wait --for=condition=ready pod/kafka-0 --timeout=120s
          sleep 15
          echo "Kafka ready!"

      - name: Apply app configs
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f services.yaml

      - name: Refresh Deployment
        run: |
          kubectl rollout restart deployment/book-store-app-notification-deployment

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/book-store-app-notification-deployment --timeout=120s