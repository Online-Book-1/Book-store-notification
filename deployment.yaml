apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-store-app-notification-deployment
spec:
  selector:
    matchLabels:
      app: book-store-app-notification
  template:
    metadata:
      labels:
        app: book-store-app-notification
    spec:
      containers:
      - name: book-store-app-notification-container
        image: hritik2345/book-store-app-noti:latest
        resources:
          requests:
            
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 8001
        envFrom:
        - secretRef:
            name: mysecret
